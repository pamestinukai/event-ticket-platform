spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.config.import=optional:application-local.properties

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:no-reply@example.com}
app.mail.from-name=${MAIL_FROM_NAME:Pamestinukai}
app.scheduler.email-retry.rate-ms=${APP_SCHEDULER_EMAIL_RETRY_RATE_MS:60000}
app.mail.retry.max-attempts=${APP_MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry.delay-minutes=${APP_MAIL_RETRY_DELAY_MINUTES:5}

app.reminder.lead-hours=${APP_REMINDER_LEAD_HOURS:24}
app.scheduler.reminder.rate-ms=${APP_SCHEDULER_REMINDER_RATE_MS:60000}

stripe.api-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}


app.email.provider=${APP_EMAIL_PROVIDER:smtp}
#alternative
#app.email.provider=logging
